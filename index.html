 };
 useEffect(()=>localStorage.setItem(STORAGE.entradas,JSON.stringify(entradas)),[entradas]);useEffect(()=>localStorage.setItem(STORAGE.bancos,JSON.stringify(bancos)),[bancos]);useEffect(()=>localStorage.setItem(STORAGE.categorias,JSON.stringify(categorias)),[categorias]);useEffect(()=>localStorage.setItem(STORAGE.tipoCambio,String(tipoCambio)),[tipoCambio]);

 const financialGuide=(()=>{
  const positivos=[],atenciones=[],acciones=[];
  const add=(arr,title,text)=>arr.push({title,text});
  const topName=expenseSubs[0]?.[0]||'la categoría principal de gasto';
  const topValue=expenseSubs[0]?.[1]||0;
  const topShare=totals.gas>0?topValue/totals.gas*100:0;
  const gastoChange=previousTotals.gas>0?(totals.gas-previousTotals.gas)/previousTotals.gas*100:null;
  const ingresoChange=previousTotals.ing>0?(totals.ing-previousTotals.ing)/previousTotals.ing*100:null;

  if(totals.ing>0&&totals.saldo>=0)add(positivos,'Saldo positivo',`Los ingresos superan los gastos por ₡${fmt(totals.saldo)}.`);
  if(totals.ing>0&&gastoPct<=80)add(positivos,'Gasto controlado',`Los gastos consumen ${pct(gastoPct)} de los ingresos.`);
  if(ahorroPct>=10)add(positivos,'Ahorro registrado',`El ahorro representa ${pct(ahorroPct)} de los ingresos.`);
  if(gastoChange!==null&&gastoChange<0)add(positivos,'Mejora frente al período anterior',`Los gastos disminuyeron ${pct(Math.abs(gastoChange))}.`);
  if(ingresoChange!==null&&ingresoChange>0)add(positivos,'Ingresos en crecimiento',`Los ingresos aumentaron ${pct(ingresoChange)} frente a ${monthLabel(previousPeriod)}.`);
  if(filtered.length>0)add(positivos,'Registro actualizado',`Hay ${filtered.length} movimientos disponibles para analizar.`);

  if(totals.ing<=0)add(atenciones,'Sin ingresos registrados','No es posible medir gasto, ahorro ni flujo como porcentaje de ingresos.');
  if(totals.saldo<0)add(atenciones,'Déficit del período',`Los gastos superan los ingresos por ₡${fmt(Math.abs(totals.saldo))}.`);
  if(totals.ing>0&&gastoPct>80)add(atenciones,'Uso elevado de ingresos',`Los gastos representan ${pct(gastoPct)} de los ingresos.`);
  if(totals.ing>0&&ahorroPct<10)add(atenciones,'Ahorro bajo',ahorroPct>0?`El ahorro equivale a ${pct(ahorroPct)} de los ingresos.`:'No hay transferencias de ahorro registradas.');
  if(gastoChange!==null&&gastoChange>15)add(atenciones,'Crecimiento de gastos',`Los gastos aumentaron ${pct(gastoChange)} frente a ${monthLabel(previousPeriod)}.`);
  if(topShare>35)add(atenciones,'Gasto concentrado',`${topName} concentra ${pct(topShare)} del gasto del período.`);
  if(filtered.length<5)add(atenciones,'Información limitada','Hay pocos movimientos; la lectura puede no representar el período completo.');

  if(totals.saldo<0)add(acciones,'Detener gastos discrecionales',`Pausá temporalmente gastos no esenciales hasta recuperar un flujo positivo.`);
  if(totals.ing>0&&gastoPct>80)add(acciones,'Reducir el gasto principal',`Revisá ${topName} y buscá reducirlo al menos un 10% en el próximo período.`);
  if(totals.ing>0&&ahorroPct<10)add(acciones,'Programar una transferencia de ahorro','Definí una primera meta de ahorro equivalente al 10% de los ingresos.');
  if(gastoChange!==null&&gastoChange>15)add(acciones,'Explicar la variación',`Compará los gastos nuevos o extraordinarios contra ${monthLabel(previousPeriod)}.`);
  if(topShare>35)add(acciones,'Diversificar el presupuesto',`Establecé un límite mensual para ${topName} y revisalo antes de nuevos gastos.`);
  if(!acciones.length)add(acciones,'Mantener el cierre mensual','Continuá registrando ingresos, gastos y ahorro para conservar una lectura comparable.');

  const completar=(lista,alternativas,cantidad)=>{alternativas.forEach(x=>{if(lista.length<cantidad&&!lista.some(y=>y.title===x.title))lista.push(x)});return lista.slice(0,cantidad)};
  completar(positivos,[
   {title:'Visibilidad financiera',text:'Los movimientos están organizados por período y categoría.'},
   {title:'Tipo de cambio histórico',text:'Los equivalentes en USD conservan el tipo de cambio de cada movimiento.'},
   {title:'Seguimiento por categoría',text:'El dashboard permite identificar dónde se concentra el dinero.'}
  ],3);
  completar(atenciones,[
   {title:'Revisar movimientos extraordinarios',text:'Confirmá si los gastos más altos son recurrentes o excepcionales.'},
   {title:'Validar categorías',text:'Una clasificación consistente mejora las comparaciones entre períodos.'},
   {title:'Revisar el cierre del período',text:'Asegurate de incluir ingresos, gastos y transferencias pendientes.'}
  ],3);
  return{positivos:positivos.slice(0,3),atenciones:atenciones.slice(0,3),acciones:acciones.slice(0,3)};
 })();

 const exportConfig=()=>{const b=new Blob([JSON.stringify({version:'3.0 Fase 1',bancos,categorias,tipoCambio},null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='Configuracion Familiar.json';a.click();URL.revokeObjectURL(u);note('📤 Configuración exportada')};
 const importConfig=ev=>{const f=ev.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const c=JSON.parse(r.result);if(!Array.isArray(c.bancos)||!Array.isArray(c.categorias))throw 0;if(confirm('Se reemplazarán bancos, categorías y tipo de cambio. Los movimientos NO se modificarán.')){setBancos(c.bancos);setCategorias(c.categorias);if(Number(c.tipoCambio)>0)setTipoCambio(Number(c.tipoCambio));note('📥 Configuración importada')}}catch{note('⚠️ Archivo inválido')}ev.target.value=''};r.readAsText(f)};

 <div className="card advisorSection"><div className="advisorHeader"><div><h3 style={{margin:'0 0 4px'}}>🧭 Guía financiera personal</h3><div className="muted">Consejos automáticos basados en reglas y en los movimientos de este navegador.</div></div><span className="advisorBadge">Sin IA · costo cero</span></div><div className="advisorGrid"><div className="adviceCard good"><h4>✅ Aspectos positivos</h4><ol className="adviceList">{financialGuide.positivos.map((x,i)=><li key={`p-${i}`}><b>{x.title}</b>{x.text}</li>)}</ol></div><div className="adviceCard watch"><h4>⚠️ Puntos de atención</h4><ol className="adviceList">{financialGuide.atenciones.map((x,i)=><li key={`w-${i}`}><b>{x.title}</b>{x.text}</li>)}</ol></div><div className="adviceCard action"><h4>🎯 Acciones sugeridas</h4><ol className="adviceList">{financialGuide.acciones.map((x,i)=><li key={`a-${i}`}><b>{x.title}</b>{x.text}</li>)}</ol></div></div><div className="advisorDisclaimer">Orientación informativa basada únicamente en los movimientos registrados; no sustituye asesoría financiera profesional. La capa de IA consolidada se construirá posteriormente en Google.</div></div>
 </div></div>}
 {tab==='ajustes'&&<div className="stack"><div className="card"><h3>🔗 Dashboard consolidado de Google</h3><div className="dashboardLinkBox"><p style={{marginTop:0}}>Pegá el enlace directo a la pestaña <b>Dashboard_Consolidado</b> de tu Reporte Consolidado. El enlace se guarda únicamente en este navegador.</p><label className="field">URL de Google Sheets<input type="url" value={dashboardUrlDraft} onChange={e=>setDashboardUrlDraft(e.target.value)} placeholder="https://docs.google.com/spreadsheets/d/.../edit#gid=..."/></label><div className="dashboardLinkActions"><button className="mini" onClick={guardarDashboardUrl}>💾 Guardar enlace</button><button className="small" onClick={abrirDashboardConsolidado} disabled={!dashboardUrl}>↗ Abrir dashboard</button>{dashboardUrl&&<button className="small" onClick={()=>{localStorage.removeItem(STORAGE.dashboardUrl);setDashboardUrl('');setDashboardUrlDraft('');note('🗑️ Enlace eliminado')}}>Eliminar enlace</button>}</div><div className="linkStatus">{dashboardUrl?'✅ Enlace configurado. Se abrirá usando tu sesión privada de Google.':'Pendiente de configuración.'}</div></div></div><div className="card"><h3>🏦 Bancos y fuentes</h3><div className="chips">{bancos.map(b=><span className="chip" key={b}>{b}</span>)}</div><div className="row"><input value={nuevoB} placeholder="Nuevo banco" onChange={e=>setNuevoB(e.target.value)}/><button className="mini" onClick={addBank}>Agregar</button></div></div><div className="card"><h3>📁 Categorías y subcategorías</h3><div className="row"><input value={nuevoG} placeholder="Nueva categoría" onChange={e=>setNuevoG(e.target.value)}/><button className="mini" onClick={addGroup}>Agregar grupo</button></div><br/><label className="field">Grupo a editar<select value={grupoSel} onChange={e=>setGrupoSel(e.target.value)}>{categorias.map(c=><option key={c.grupo}>{c.grupo}</option>)}</select></label><div className="chips">{[...new Set([...(categorias.find(c=>c.grupo===grupoSel)?.ingreso||[]),...(categorias.find(c=>c.grupo===grupoSel)?.gasto||[]),...(categorias.find(c=>c.grupo===grupoSel)?.transferencia||[])])].sort((a,b)=>a.localeCompare(b,'es')).map(s=><span className="chip" key={s}>{subDisplay(s)}</span>)}</div><div className="row"><input value={nuevaS} placeholder="Nueva subcategoría" onChange={e=>setNuevaS(e.target.value)}/><button className="mini" onClick={addSub}>Agregar sub</button></div></div><div className="card"><h3>🔄 Compartir configuración</h3><p>Exporta categorías, bancos y tipo de cambio actual. Importar no modifica los movimientos ni sus tipos de cambio históricos.</p><div className="row"><button className="mini" onClick={exportConfig}>📤 Exportar</button><button className="mini" onClick={()=>fileRef.current.click()}>📥 Importar</button><input ref={fileRef} type="file" accept=".json" onChange={importConfig} style={{display:'none'}}/></div></div></div>}
 {tab==='excel'&&<div className="card"><h2>📊 Exportar Excel</h2><p>El archivo conserva el monto en colones, el tipo de cambio de cada movimiento y su equivalente histórico en USD.</p><div className="summary"><b>Usuario:</b> {usuario}<br/><b>Movimientos:</b> {entradas.length}<br/><b>Períodos disponibles:</b> {periodos.length}<br/><b>Tipo de cambio actual:</b> ₡{fmt(tipoCambio)} por USD</div><button className="primary" onClick={exportExcel}>Descargar Excel</button></div>}
 </div></div></>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
