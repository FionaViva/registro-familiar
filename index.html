 const parsearRespuestaAsesor=(contenido,data)=>{

   const mapa={};let general='';
   String(contenido||'').split(/\r?\n/).map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean).forEach(linea=>{
     const partes=linea.split('::').map(x=>x.trim());
     if(partes.length<2)return;
     const codigo=String(partes.shift()||'').toUpperCase();
     if(codigo==='C0'){if(!general)general=partes.join(' :: ').trim();return}
     if(partes.length<2)return;
     const id=partes.shift(),comentario=partes.join(' :: ').trim(),tipo=codigo.charAt(0),num=Number(codigo.slice(1));

     if(!candidato||mapa[codigo])return;
     mapa[codigo]={titulo:String(candidato.titulo||''),comentario:comentario||String(candidato.comentario||''),evidencia:String(candidato.evidencia||'')};
   });

     const salida=[],claves=new Set();

       claves.add(clave);salida.push({titulo,comentario,evidencia});

     codigos.forEach(k=>{if(salida.length<maximo)add(mapa[k])});
     (listaBase||[]).forEach(x=>{if(salida.length<minimo)add(x)});
     if(minimo===maximo)(listaBase||[]).forEach(x=>{if(salida.length<maximo)add(x)});
     if(salida.length<minimo)throw new Error('No hay suficientes hallazgos válidos para completar el análisis.');
     return salida.slice(0,maximo);
   };

     positivos:completar(['P1','P2','P3'],base.positivos,3,3),
     atencion:completar(['A1','A2','A3'],base.atencion,3,3),
     revisar_o_detener:completar(['R1','R2','R3'],base.revisar_o_detener,2,3),

 const excelDateToISO=v=>{
  if(v instanceof Date&&!isNaN(v))return v.toISOString().slice(0,10);
  if(typeof v==='number'&&Number.isFinite(v)){
   const p=XLSX.SSF.parse_date_code(v);
   if(p)return `${String(p.y).padStart(4,'0')}-${String(p.m).padStart(2,'0')}-${String(p.d).padStart(2,'0')}`;
  }
  const s=String(v??'').trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);
  const m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);
  if(m)return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  const d=new Date(s);
  return isNaN(d)?'':d.toISOString().slice(0,10);
 };

     })}
   </svg>
 };
 const FamilyPropertyTrendChart=({data})=>{
   const rows=(data||[]).slice(-6);
   if(!rows.length)return <div className="empty">Aún no hay histórico por propiedad.</div>;
   const nombres=['Nuestra Casa','Cassis','Grimaud','Marsella'];
   const serie=(row,n)=>Number((row.propiedades||[]).find(p=>p.nombre===n)?.gastosCRC||0);
   const vals=rows.flatMap(r=>nombres.map(n=>serie(r,n)));
   const max=Math.max(...vals,1),w=560,h=220,left=62,right=12,top=15,bottom=30;
   const x=i=>rows.length===1?(left+w-right)/2:left+i*(w-left-right)/(rows.length-1);
   const y=v=>h-bottom-(Number(v||0)/max)*(h-top-bottom);
   const clases=['chartLineA','chartLineB','chartLineC','chartLineD'];
   const puntos=['chartPointA','chartPointB','chartPointC','chartPointD'];
   const ticks=[0,.25,.5,.75,1];
   return <svg viewBox={`0 0 ${w} ${h}`} className="chartSvg">
     {ticks.map((q,i)=>{
       const yy=top+(h-top-bottom)*q;
       const valor=max*(1-q);
       return <g key={i}><line className="chartGrid" x1={left} x2={w-right} y1={yy} y2={yy}/><text className="chartText" x={left-7} y={yy+3} textAnchor="end">{chartMontoCorto(valor)}</text></g>
     })}
     <line className="chartAxis" x1={left} x2={left} y1={top} y2={h-bottom}/>
     {nombres.map((n,j)=><g key={n}><polyline className={clases[j]} points={rows.map((r,i)=>`${x(i)},${y(serie(r,n))}`).join(' ')}/>{rows.map((r,i)=><circle key={`${n}-${r.periodo}`} className={puntos[j]} cx={x(i)} cy={y(serie(r,n))} r="2.6"/>)}</g>)}
     {rows.map((r,i)=><text key={r.periodo} className="chartText" x={x(i)} y={h-8} textAnchor="middle">{chartMesCorto(r.mes||r.periodo)}</text>)}
   </svg>
 };
 const FamilyRatioTrendChart=({data})=>{
   const rows=(data||[]).slice(-6);
   if(!rows.length)return <div className="empty">Aún no hay histórico de indicadores.</div>;
   const gasto=r=>Number(r.tasaGastos||0)*100, ahorro=r=>Number(r.tasaAhorro||0)*100;
   const max=Math.max(100,...rows.flatMap(r=>[gasto(r),ahorro(r)])),w=560,h=220,left=35,right=12,top=15,bottom=30;
   const x=i=>rows.length===1?(left+w-right)/2:left+i*(w-left-right)/(rows.length-1);
   const y=v=>h-bottom-(Number(v||0)/max)*(h-top-bottom);
   return <svg viewBox={`0 0 ${w} ${h}`} className="chartSvg">
     {[0,.25,.5,.75,1].map((q,i)=><g key={i}><line className="chartGrid" x1={left} x2={w-right} y1={top+(h-top-bottom)*q} y2={top+(h-top-bottom)*q}/><text className="chartText" x={left-5} y={top+(h-top-bottom)*q+3} textAnchor="end">{Math.round(max*(1-q))}%</text></g>)}
     <polyline className="chartLineB" points={rows.map((r,i)=>`${x(i)},${y(gasto(r))}`).join(' ')}/><polyline className="chartLineA" points={rows.map((r,i)=>`${x(i)},${y(ahorro(r))}`).join(' ')}/>
     {rows.map((r,i)=><g key={r.periodo}><circle className="chartPointB" cx={x(i)} cy={y(gasto(r))} r="3"/><circle className="chartPointA" cx={x(i)} cy={y(ahorro(r))} r="3"/><text className="chartText" x={x(i)} y={h-8} textAnchor="middle">{chartMesCorto(r.mes||r.periodo)}</text></g>)}
   </svg>
 };

  <div className="chartBox"><h3 style={{marginTop:0}}>Distribución de gastos</h3>{!expenseSubs.length?<div className="empty">No hay gastos en este período.</div>:expenseSubs.map(([name,value])=>{const share=totals.gas>0?value/totals.gas*100:0;return <div className="barRow" key={name}><div className="barLabel"><span>{subDisplay(name)}</span><b>{pct(share)} · ₡{fmt(value)}</b></div><div className="barTrack"><div className="barFill" style={{width:`${Math.max(3,value/maxExpenseSub*100)}%`}}></div></div></div>})}</div>

  <div className="chartBox"><h3 style={{marginTop:0}}>Balance por categoría principal</h3>{!groupSummary.length?<div className="empty">No hay movimientos en este período.</div>:groupSummary.map(([name,v])=><div className="groupRow" key={name}><div><b>{name}</b><div className="muted">{v.ahorro>0?`Ahorro: ₡${fmt(v.ahorro)}`:'Sin transferencias de ahorro'}</div></div><div className="groupNumbers"><span className="positive">Ingresos ₡{fmt(v.ing)}</span><br/><span className="negative">Gastos ₡{fmt(v.gas)}</span><br/><b className={v.saldo>=0?'positive':'negative'}>Balance ₡{fmt(v.saldo)}</b></div></div>)}</div>
 </div>

 <div className="dashGrid">
  <div className="chartBox"><h3 style={{marginTop:0}}>📊 Lectura del período</h3><div className="summary">{totals.ing<=0?<span>No hay ingresos registrados para calcular porcentajes financieros.</span>:<span><b>Capacidad de ahorro:</b> {pct(ahorroPct)} — {ahorroNivel}.<br/><b>Consumo de ingresos:</b> los gastos representan {pct(gastoPct)} de los ingresos.<br/><b>Flujo neto:</b> {totals.saldo>=0?'positivo':'negativo'} por ₡{fmt(Math.abs(totals.saldo))}.<br/><b>Mayor gasto:</b> {expenseSubs.length?`${expenseSubs[0][0]} con ${pct(expenseSubs[0][1]/totals.gas*100)}`:'sin gastos registrados'}.</span>}</div></div>
  <div className="chartBox"><h3 style={{marginTop:0}}>Resumen del período</h3><div className="summary"><b>Período:</b> {monthLabel(periodo)}<br/><b>Categoría principal:</b> {grupoDashboard==='ALL'?'Todas':grupoDashboard}<br/><b>Movimientos:</b> {filtered.length}<br/><b>Ingresos:</b> ₡{fmt(totals.ing)}<br/><b>Gastos:</b> ₡{fmt(totals.gas)}<br/><b>Flujo neto:</b> ₡{fmt(totals.saldo)}<br/><b>Aportes al ahorro:</b> ₡{fmt(totals.ahorro)}</div></div>
 </div>

 <div className="card advisorSection"><div className="advisorHeader"><div><h3 style={{margin:'0 0 4px'}}>🧭 Guía financiera personal</h3><div className="muted">Consejos automáticos basados en reglas y en los movimientos de este navegador.</div></div><span className="advisorBadge">Sin IA · costo cero</span></div><div className="advisorGrid"><div className="adviceCard good"><h4>✅ Aspectos positivos</h4><ol className="adviceList">{financialGuide.positivos.map((x,i)=><li key={`p-${i}`}><b>{x.title}</b>{x.text}</li>)}</ol></div><div className="adviceCard watch"><h4>⚠️ Puntos de atención</h4><ol className="adviceList">{financialGuide.atenciones.map((x,i)=><li key={`w-${i}`}><b>{x.title}</b>{x.text}</li>)}</ol></div><div className="adviceCard action"><h4>🎯 Acciones sugeridas</h4><ol className="adviceList">{financialGuide.acciones.map((x,i)=><li key={`a-${i}`}><b>{x.title}</b>{x.text}</li>)}</ol></div></div><div className="advisorDisclaimer">Orientación informativa basada únicamente en los movimientos registrados; no sustituye asesoría financiera profesional. Para el análisis consolidado con IA, usá el botón 🤖 Mi Asesor.</div></div>
 </div></div>}
 
 {tab==='asesor'&&<div className="stack">
   {(!advisorUrl||!familyKey)&&<div className="backendNotice"><b>⚙️ Falta completar el acceso familiar.</b><br/>Entrá a Ajustes y verificá la URL <b>/exec</b> y la <b>clave familiar</b>.</div>}
   {advisorError&&<div className="backendNotice backendError"><b>Mi Asesor encontró un problema.</b><br/>{advisorError}</div>}
   {advisorUrl&&familyKey&&<div className="aiHero">
     <div className="aiHeroTop"><div><h2>🤖 Mi Asesor Financiero</h2><div className="muted">Análisis consolidado familiar · IA local dentro de la misma app</div></div><span className="aiStatusBadge">{advisorData?(advisorData.resultadoIA?'IA local guardada':'Base financiera'):'Conectando…'}</span></div>
     <div className="aiHeroActions">
       <label className="field">Período
         <select className="period" value={advisorData?.periodo||(periodo==='ALL'?monthKey(hoy()):periodo)} onChange={e=>cargarAsesorFamiliar(e.target.value)}>
           {(advisorData?.periodosDisponibles||[]).map(p=><option key={p.periodo} value={p.periodo}>{p.mes} · {p.estado}</option>)}
         </select>
       </label>
       <div className="aiToolbar">
         <button className="aiSecondary" disabled={advisorLoading||advisorGenerating} onClick={()=>cargarAsesorFamiliar(advisorData?.periodo)}>↻ Actualizar</button>
         <button className="aiPrimary" disabled={!advisorData||advisorLoading||advisorGenerating} onClick={generarAsesorLocal}>{advisorGenerating?'Analizando…':'✨ Regenerar con IA local'}</button>
       </div>
     </div>
     {(advisorGenerating||advisorProgress>0)&&<div className="aiProgress"><span style={{width:`${Math.max(0,Math.min(100,advisorProgress))}%`}}/></div>}
     {advisorStatus&&<div className="aiStatus">{advisorStatus}</div>}
   </div>}
   {advisorLoading&&!advisorData&&<div className="card"><div className="empty">Cargando análisis financiero familiar…</div></div>}
   {advisorData&&<>
     <div className="aiMeta"><span>{advisorData.mes}</span><span>{advisorData.estadoPeriodo}</span><span>{advisorData.estadoAnalisis}</span>{advisorData.modeloIA&&<span>{advisorData.modeloIA}</span>}<span>Datos: {advisorData.fechaDatos||advisorData.fechaGeneracion||'—'}</span></div>
     <div className="aiGrid">
       <div className="aiSection good"><h3>✅ Aspectos positivos</h3><AdvisorList items={advisorVisible.positivos}/></div>
       <div className="aiSection watch"><h3>⚠️ Puntos de atención</h3><AdvisorList items={advisorVisible.atencion}/></div>
       <div className="aiSection action"><h3>🎯 Revisar o actuar</h3><AdvisorList items={advisorVisible.revisar_o_detener||advisorVisible.revisarODetener}/></div>
     </div>
     {(advisorVisible.comentario_general||advisorVisible.comentarioGeneral)&&<div className="aiGeneral"><h3>💬 Comentario general de Mi Asesor</h3><p>{advisorVisible.comentario_general||advisorVisible.comentarioGeneral}</p></div>}
     <div className="card"><div className="aiPrivacy"><b>Privacidad:</b> los datos financieros detallados no se envían a un proveedor de IA. Apps Script prepara candidatos agregados y el modelo WebLLM corre localmente en este dispositivo usando WebGPU. El resultado final se guarda en <b>Analisis_Financiero</b> cuando la conexión lo permite.</div></div>
   </>}
 </div>}

 {tab==='ajustes'&&<div className="stack"><div className="card"><h3>🔐 Acceso familiar</h3><div className="dashboardLinkBox"><p style={{marginTop:0}}>Esta clave privada permite que Fiona y Berny consulten el mismo backend familiar. Se guarda solo en este navegador y <b>no está escrita dentro del código del app</b>.</p><label className="field">Clave familiar<input type="password" value={familyKeyDraft} onChange={e=>setFamilyKeyDraft(e.target.value)} placeholder="Pegá la clave generada en Apps Script"/></label><div className="dashboardLinkActions"><button className="mini" onClick={guardarFamilyKey}>🔐 Guardar clave</button>{familyKey&&<button className="small" onClick={()=>{localStorage.removeItem(STORAGE.familyKey);setFamilyKey('');setFamilyKeyDraft('');setFamilyDashboard(null);setAdvisorData(null);note('🗑️ Clave familiar eliminada de este dispositivo')}}>Eliminar clave</button>}</div><div className="linkStatus">{familyKey?'✅ Este dispositivo tiene una clave familiar configurada.':'Pendiente: ejecutá configurarAccesoFamiliar() en Apps Script y pegá aquí la clave.'}</div></div></div><div className="card"><h3>🤖 Mi Asesor Financiero</h3><div className="dashboardLinkBox"><p style={{marginTop:0}}>Pegá la URL <b>/exec</b> del backend consolidado. La URL identifica el backend; la clave familiar controla quién puede leerlo desde el app.</p><label className="field">URL de Mi Asesor<input type="url" value={advisorUrlDraft} onChange={e=>setAdvisorUrlDraft(e.target.value)} placeholder="https://script.google.com/macros/s/.../exec"/></label><div className="dashboardLinkActions"><button className="mini" onClick={guardarAdvisorUrl}>💾 Guardar backend</button><button className="small" onClick={()=>setTab('asesor')} disabled={!advisorUrl}>🤖 Ir a Mi Asesor</button>{advisorUrl&&<button className="small" onClick={()=>{localStorage.removeItem(STORAGE.advisorUrl);setAdvisorUrl('');setAdvisorUrlDraft('');setAdvisorData(null);note('🗑️ Enlace de backend eliminado')}}>Eliminar enlace</button>}</div><div className="linkStatus">{advisorUrl?'✅ URL del backend configurada.':'Pendiente de configuración.'}</div></div></div><div className="card"><h3>🧰 Respaldo: Dashboard consolidado en Google Sheets</h3><div className="dashboardLinkBox"><p style={{marginTop:0}}>Este enlace queda como respaldo administrativo. La visualización diaria ahora vive dentro de <b>🏠 Dashboard familiar</b>.</p><label className="field">URL de Google Sheets<input type="url" value={dashboardUrlDraft} onChange={e=>setDashboardUrlDraft(e.target.value)} placeholder="https://docs.google.com/spreadsheets/d/.../edit#gid=..."/></label><div className="dashboardLinkActions"><button className="mini" onClick={guardarDashboardUrl}>💾 Guardar enlace</button><button className="small" onClick={abrirDashboardConsolidado} disabled={!dashboardUrl}>↗ Abrir dashboard</button>{dashboardUrl&&<button className="small" onClick={()=>{localStorage.removeItem(STORAGE.dashboardUrl);setDashboardUrl('');setDashboardUrlDraft('');note('🗑️ Enlace eliminado')}}>Eliminar enlace</button>}</div><div className="linkStatus">{dashboardUrl?'✅ Enlace configurado. Se abrirá usando tu sesión privada de Google.':'Pendiente de configuración.'}</div></div></div><div className="card"><h3>🏦 Bancos y fuentes</h3><div className="chips">{bancos.map(b=><span className="chip" key={b}>{b}</span>)}</div><div className="row"><input value={nuevoB} placeholder="Nuevo banco" onChange={e=>setNuevoB(e.target.value)}/><button className="mini" onClick={addBank}>Agregar</button></div></div><div className="card"><h3>📁 Categorías y subcategorías</h3><div className="row"><input value={nuevoG} placeholder="Nueva categoría" onChange={e=>setNuevoG(e.target.value)}/><button className="mini" onClick={addGroup}>Agregar grupo</button></div><br/><label className="field">Grupo a editar<select value={grupoSel} onChange={e=>setGrupoSel(e.target.value)}>{categorias.map(c=><option key={c.grupo}>{c.grupo}</option>)}</select></label><div className="chips">{[...new Set([...(categorias.find(c=>c.grupo===grupoSel)?.ingreso||[]),...(categorias.find(c=>c.grupo===grupoSel)?.gasto||[]),...(categorias.find(c=>c.grupo===grupoSel)?.transferencia||[])])].sort((a,b)=>a.localeCompare(b,'es')).map(s=><span className="chip" key={s}>{subDisplay(s)}</span>)}</div><div className="row"><input value={nuevaS} placeholder="Nueva subcategoría" onChange={e=>setNuevaS(e.target.value)}/><button className="mini" onClick={addSub}>Agregar sub</button></div></div><div className="card"><h3>🛟 Respaldo y restauración</h3><div className="restoreBox"><p style={{marginTop:0}}>Importá un Excel exportado por el app para recuperar movimientos en este dispositivo. Antes de escribir nada, el app valida el archivo y muestra una previsualización.</p><button className="mini" onClick={()=>restoreRef.current.click()}>📥 Seleccionar respaldo Excel</button><input ref={restoreRef} type="file" accept=".xlsx,.xls" onChange={leerRespaldo} style={{display:'none'}}/>{restorePreview&&<div className="restorePreview"><b>Archivo:</b> {restorePreview.archivo}<br/><b>Usuario(s):</b> {restorePreview.usuarios.join(', ')||'Sin usuario'}<br/><b>Período:</b> {restorePreview.desde} → {restorePreview.hasta}<br/><b>Movimientos únicos del respaldo:</b> {restorePreview.movimientos.length}<br/><span className="restoreOk"><b>Nuevos en este dispositivo:</b> {restorePreview.nuevos}</span><br/><span className={restorePreview.repetidos?'restoreWarn':''}><b>IDs ya existentes:</b> {restorePreview.repetidos}</span>{restorePreview.duplicadosArchivo>0&&<><br/><span className="restoreWarn"><b>Duplicados internos descartados:</b> {restorePreview.duplicadosArchivo}</span></>}<div className="restoreActions"><button className="mini" onClick={restaurarRespaldo}>Restaurar movimientos</button><button className="small" onClick={()=>setRestorePreview(null)}>Cancelar</button></div></div>}<div className="hint" style={{marginTop:10}}>La restauración deduplica por ID. Si un ID ya existe, conserva la versión del respaldo; los demás movimientos actuales no se eliminan.</div></div></div><div className="card"><h3>🔄 Compartir configuración</h3><p>Exporta categorías, bancos y tipo de cambio actual. Importar no modifica los movimientos ni sus tipos de cambio históricos.</p><div className="row"><button className="mini" onClick={exportConfig}>📤 Exportar</button><button className="mini" onClick={()=>fileRef.current.click()}>📥 Importar</button><input ref={fileRef} type="file" accept=".json" onChange={importConfig} style={{display:'none'}}/></div></div></div>}
 {tab==='excel'&&<div className="card"><h2>📊 Exportar Excel</h2><p>El archivo conserva el monto en colones, el tipo de cambio de cada movimiento y su equivalente histórico en USD.</p><div className="summary"><b>Usuario:</b> {usuario}<br/><b>Movimientos:</b> {entradas.length}<br/><b>Períodos disponibles:</b> {periodos.length}<br/><b>Tipo de cambio actual:</b> ₡{fmt(tipoCambio)} por USD</div><button className="primary" onClick={exportExcel}>Descargar Excel</button></div>}
 </div></div></>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
