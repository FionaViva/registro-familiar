<style>
*{box-sizing:border-box}body{margin:0;background:#f0ede8;font-family:Palatino,'Palatino Linotype',Georgia,serif;color:#1b2a4a}button,input,select{font:inherit}button{cursor:pointer}.wrap{max-width:820px;margin:auto}.header{background:linear-gradient(135deg,#1b2a4a,#2d4a7a);color:white;padding:22px 18px 18px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.title{font-size:23px;font-weight:700}.tag{opacity:.65;font-size:12px;margin-top:3px}.fx{display:flex;gap:8px;align-items:center;font-size:12px}.fx input{width:90px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:white;padding:7px;border-radius:8px}.nav{display:flex;gap:7px;flex-wrap:wrap;padding:14px 16px 0}.nav button,.pill{border:1px solid #ccc;background:white;padding:8px 14px;border-radius:20px}.nav .active{background:#1b2a4a;color:white;border-color:#1b2a4a}.dashboardBtn{background:#c9a84c!important;color:#17233f!important;border-color:#c9a84c!important;font-weight:700}.dashboardBtn.active{box-shadow:0 0 0 2px rgba(201,168,76,.25)}.main{padding:16px 16px 60px}.card{background:white;border-radius:16px;padding:20px;box-shadow:0 2px 16px rgba(0,0,0,.07)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}.field{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:#555}.field input,.field select{width:100%;padding:10px;border:1.5px solid #ddd;border-radius:8px;background:#fafafa}.hint{font-size:11px;color:#7b8494;font-weight:400}.primary{width:100%;border:0;background:#1b2a4a;color:white;padding:13px;border-radius:10px;font-weight:700;margin-top:18px}.secondary{width:100%;border:1px solid #bbb;background:white;color:#555;padding:10px;border-radius:10px;margin-top:8px}.list{display:flex;flex-direction:column;gap:8px}.item{display:flex;justify-content:space-between;gap:10px;background:#f8f7f4;border-left:4px solid #1b2a4a;border-radius:10px;padding:12px}.muted{font-size:11px;color:#888}.desc{font-weight:700;margin:2px 0}.right{text-align:right;flex-shrink:0}.amount{font-weight:700}.usd{font-size:11px;color:#7b8494;margin-top:2px}.actions{display:flex;gap:5px;justify-content:flex-end;margin-top:6px}.small{border:1px solid #ddd;background:white;border-radius:6px;padding:4px 7px;font-size:11px}.stack{display:flex;flex-direction:column;gap:18px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row input{flex:1;min-width:180px;padding:9px;border:1.5px solid #ddd;border-radius:8px}.mini{border:0;background:#1b2a4a;color:white;padding:9px 12px;border-radius:8px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.chip{background:#e8f0fe;border-radius:20px;padding:5px 10px;font-size:12px}.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:20;background:#1b2a4a;color:white;padding:10px 22px;border-radius:30px;box-shadow:0 3px 16px rgba(0,0,0,.2)}.modal{position:fixed;inset:0;background:rgba(15,23,42,.62);display:flex;align-items:center;justify-content:center;padding:20px;z-index:15}.modal .card{max-width:420px;width:100%}.notice{background:#fff7ed;border:1px solid #fed7aa;padding:10px;border-radius:10px;color:#9a3412;margin-bottom:14px}.summary{background:#f8f7f4;border-radius:12px;padding:14px;line-height:1.8;font-size:13px}.dashTop{display:flex;justify-content:space-between;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:16px}.dashTitle{margin:0}.period{min-width:205px;padding:9px 11px;border:1.5px solid #ddd;border-radius:9px;background:#fafafa}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#f8f7f4;border-radius:12px;padding:14px}.stat small{display:block;color:#78808d;text-transform:uppercase;font-size:10px;letter-spacing:.4px}.stat strong{display:block;font-size:18px;margin-top:5px}.stat .usd{font-size:10px}.dashGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.chartBox{background:#fff;border:1px solid #ece9e2;border-radius:12px;padding:15px}.barRow{margin:10px 0}.barLabel{display:flex;justify-content:space-between;gap:10px;font-size:12px;margin-bottom:4px}.barTrack{height:9px;background:#eceff3;border-radius:20px;overflow:hidden}.barFill{height:100%;background:#2d4a7a;border-radius:20px}.monthSummary{background:#eef3f8;border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:12px;line-height:1.6}.empty{text-align:center;padding:28px;color:#9299a5}@media(max-width:650px){.grid,.dashGrid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.top{align-items:flex-start}.fx{width:100%;justify-content:space-between}}@media(max-width:390px){.stats{grid-template-columns:1fr}}

<body><div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useMemo,useRef}=React;
const STORAGE={usuario:'rff_usuario_v11',entradas:'rff_entradas_v11',bancos:'rff_bancos_v11',categorias:'rff_categorias_v11',tipoCambio:'rff_tipo_cambio_v11'};
const BANCOS_DEFECTO=['Davivienda','DaviBank','BAC','Efectivo'];
const CATEGORIAS_DEFECTO=[
{grupo:'🏠 Nuestra Casa',subs:['Ahorro','Alimentación','Educación','Gobierno/Impuestos','Intereses','Jardinería','Mantenimiento General','Miscelánea','Ocio','Otros','Salud','Seguro','Servicios Públicos','Vehículos']},
{grupo:'🏢 Cassis',subs:['Alquiler recibido','Depósito','Gobierno/Impuestos','Mantenimiento','Otro','Reparaciones','Seguro','Servicios Públicos']},
{grupo:'🏢 Grimaud',subs:['Alquiler recibido','Depósito','Gobierno/Impuestos','Mantenimiento','Otro','Reparaciones','Seguro','Servicios Públicos']},
{grupo:'🏢 Marsella',subs:['Alquiler recibido','Depósito','Gobierno/Impuestos','Mantenimiento','Otro','Reparaciones','Seguro','Servicios Públicos']}];
const hoy=()=>{const d=new Date(),o=d.getTimezoneOffset();return new Date(d.getTime()-o*60000).toISOString().slice(0,10)};
const fmt=n=>Number(n||0).toLocaleString('es-CR',{minimumFractionDigits:2,maximumFractionDigits:2});
const load=(k,f)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch{return f}};
const uid=()=>globalThis.crypto?.randomUUID?crypto.randomUUID():`rff-${Date.now()}-${Math.random().toString(16).slice(2)}`;
const monthKey=d=>String(d||'').slice(0,7);
const cleanGroup=g=>{
 const v=String(g||'').replace(/^[^\p{L}\p{N}]+/u,'').trim();
 if(['Cassis','Grimaud','Marsella','Nuestra Casa'].includes(v))return v;
 return 'Nuestra Casa';
};
const parseAmount=v=>Number(String(v||'').replace(/,/g,''));
const formatAmountInput=v=>{
 let raw=String(v??'').replace(/,/g,'').replace(/[^0-9.]/g,'');
 const parts=raw.split('.');
 const integer=(parts.shift()||'').replace(/^0+(?=\d)/,'');
 const decimals=parts.join('').slice(0,2);
 const formatted=(integer||'0').replace(/\B(?=(\d{3})+(?!\d))/g,',');
 return raw.includes('.')?`${formatted}.${decimals}`:(raw?formatted:'');
};
const monthLabel=k=>{if(k==='ALL')return'Todo el histórico';const [y,m]=k.split('-');return new Intl.DateTimeFormat('es-CR',{month:'long',year:'numeric'}).format(new Date(Number(y),Number(m)-1,1)).replace(/^./,c=>c.toUpperCase())};
function App(){
 const cats0=CATEGORIAS_DEFECTO,banks0=load(STORAGE.bancos,BANCOS_DEFECTO),fx0=Number(localStorage.getItem(STORAGE.tipoCambio))||530;
 const [categorias,setCategorias]=useState(cats0),[bancos,setBancos]=useState(banks0),[tipoCambio,setTipoCambio]=useState(fx0);
 const [entradas,setEntradas]=useState(()=>load(STORAGE.entradas,[]).map((e,i)=>{const tc=Number(e.tipoCambioMovimiento||e.tipoCambio||fx0);const monto=Number(e.montoCRC||0);return{...e,id:e.id||uid(),tipo:e.tipo||'Gasto',creadoEn:e.creadoEn||new Date(Date.now()-i).toISOString(),tipoCambioMovimiento:tc,montoUSD:Number(e.montoUSD??(tc?monto/tc:0)),fxMigrado:!e.tipoCambioMovimiento&&!e.tipoCambio}}));
 const [usuario,setUsuario]=useState(localStorage.getItem(STORAGE.usuario)||''),[uTemp,setUTemp]=useState(''),[tab,setTab]=useState('agregar'),[toast,setToast]=useState(''),[editId,setEditId]=useState(null),[periodo,setPeriodo]=useState(monthKey(hoy())),[grupoDashboard,setGrupoDashboard]=useState('ALL');
 const emptyForm=()=>({fecha:hoy(),tipo:'Gasto',grupo:cats0[0]?.grupo||'',sub:cats0[0]?.subs?.[0]||'',descripcion:'',montoCRC:'',banco:banks0[0]||'',tipoCambioMovimiento:String(tipoCambio)});
 const [form,setForm]=useState(emptyForm);
 const [nuevoB,setNuevoB]=useState(''),[nuevoG,setNuevoG]=useState(''),[grupoSel,setGrupoSel]=useState(cats0[0]?.grupo||''),[nuevaS,setNuevaS]=useState('');const fileRef=useRef();
 const note=m=>{setToast(m);setTimeout(()=>setToast(''),2600)};const subs=g=>categorias.find(c=>c.grupo===g)?.subs||[];
 useEffect(()=>localStorage.setItem(STORAGE.entradas,JSON.stringify(entradas)),[entradas]);useEffect(()=>localStorage.setItem(STORAGE.bancos,JSON.stringify(bancos)),[bancos]);useEffect(()=>localStorage.setItem(STORAGE.categorias,JSON.stringify(categorias)),[categorias]);useEffect(()=>localStorage.setItem(STORAGE.tipoCambio,String(tipoCambio)),[tipoCambio]);
 const ordered=useMemo(()=>[...entradas].sort((a,b)=>String(b.fecha||'').localeCompare(String(a.fecha||''))||String(b.creadoEn||'').localeCompare(String(a.creadoEn||''))),[entradas]);
 const periodos=useMemo(()=>Array.from(new Set(entradas.map(e=>monthKey(e.fecha)).filter(Boolean))).sort().reverse(),[entradas]);
 useEffect(()=>{if(periodo!=='ALL'&&!periodos.includes(periodo)&&periodos.length)setPeriodo(periodos[0])},[periodos]);
 const filtered=useMemo(()=>ordered.filter(e=>{
  const okPeriodo=periodo==='ALL'||monthKey(e.fecha)===periodo;
  const okGrupo=grupoDashboard==='ALL'||cleanGroup(e.grupo)===grupoDashboard;
  return okPeriodo&&okGrupo;
 }),[ordered,periodo,grupoDashboard]);
 const calcTotals=list=>{const ing=list.filter(e=>e.tipo==='Ingreso').reduce((s,e)=>s+Number(e.montoCRC||0),0),gas=list.filter(e=>e.tipo==='Gasto').reduce((s,e)=>s+Number(e.montoCRC||0),0),ahorro=list.filter(e=>e.tipo==='Transferencia').reduce((s,e)=>s+Number(e.montoCRC||0),0);return{ing,gas,ahorro,saldo:ing-gas}};
 const totals=useMemo(()=>calcTotals(filtered),[filtered]);
 const change=(k,v)=>setForm(f=>{
  const n={...f,[k]:v};
  if(k==='grupo')n.sub=subs(v)[0]||'';
  if(k==='tipo'&&v==='Transferencia'){
    n.grupo='🏠 Nuestra Casa';
    n.sub='Ahorro';
  }
  return n;
 });
 const previewUSD=parseAmount(form.montoCRC)/(Number(form.tipoCambioMovimiento)||1);
 const save=()=>{const m=parseAmount(form.montoCRC),tc=Number(form.tipoCambioMovimiento);if(!form.fecha||!form.grupo||!form.sub||!form.banco||!form.descripcion.trim()||m<=0||tc<=0)return note('⚠️ Completá todos los campos');const base={...form,montoCRC:m,tipoCambioMovimiento:tc,montoUSD:Number((m/tc).toFixed(6)),usuario,descripcion:form.descripcion.trim(),periodo:monthKey(form.fecha)};if(editId){setEntradas(x=>x.map(e=>e.id===editId?{...e,...base,actualizadoEn:new Date().toISOString(),fxMigrado:false}:e));setEditId(null);note('✅ Movimiento actualizado')}else{setEntradas(x=>[{...base,id:uid(),creadoEn:new Date().toISOString(),fxMigrado:false},...x]);note('✅ Movimiento guardado')}setForm(f=>({...f,fecha:hoy(),descripcion:'',montoCRC:'',tipoCambioMovimiento:String(tipoCambio)}));setTab('lista')};
 const edit=e=>{setForm({fecha:e.fecha,tipo:e.tipo||'Gasto',grupo:e.grupo,sub:e.sub,descripcion:e.descripcion,montoCRC:formatAmountInput(String(e.montoCRC)),banco:e.banco,tipoCambioMovimiento:String(e.tipoCambioMovimiento||tipoCambio)});setEditId(e.id);setTab('agregar');scrollTo(0,0)};
 const del=id=>{const e=entradas.find(x=>x.id===id);if(e&&confirm(`¿Eliminar "${e.descripcion}"?`)){setEntradas(x=>x.filter(a=>a.id!==id));note('🗑️ Eliminado')}};
 const color=e=>e.tipo==='Ingreso'?'#43a047':e.tipo==='Transferencia'?'#c9a84c':'#1b2a4a';
 const categories=useMemo(()=>{const map={};filtered.filter(e=>e.tipo==='Gasto').forEach(e=>{const g=cleanGroup(e.grupo);map[g]=(map[g]||0)+Number(e.montoCRC||0)});return Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,8)},[filtered]);const maxCat=categories[0]?.[1]||1;
 const exportExcel=()=>{if(!entradas.length)return note('⚠️ No hay movimientos');const rows=ordered.map(e=>({ID:e.id,Fecha:e.fecha,Periodo:monthKey(e.fecha),'Fecha de registro':e.creadoEn||'','Última actualización':e.actualizadoEn||'',Usuario:e.usuario||usuario,Tipo:e.tipo||'Gasto',Banco:e.banco,Categoria:cleanGroup(e.grupo),Subcategoria:e.sub,Descripcion:e.descripcion,'Monto CRC':Number(e.montoCRC),'Tipo de cambio CRC/USD':Number(e.tipoCambioMovimiento||tipoCambio),'Monto USD histórico':Number(e.montoUSD??(Number(e.montoCRC)/(Number(e.tipoCambioMovimiento)||tipoCambio))),'Tipo de cambio migrado':e.fxMigrado?'Sí':'No'}));const hist=calcTotals(entradas),sum=[{Concepto:'Usuario',Valor:usuario},{Concepto:'Fecha de exportación',Valor:new Date().toLocaleString('es-CR')},{Concepto:'Tipo de cambio actual',Valor:tipoCambio},{Concepto:'Ingresos históricos CRC',Valor:hist.ing},{Concepto:'Gastos históricos CRC',Valor:hist.gas},{Concepto:'Saldo histórico CRC',Valor:hist.saldo},{Concepto:'Aportes al ahorro CRC',Valor:hist.ahorro},{Concepto:'Cantidad de movimientos',Valor:entradas.length}];const wb=XLSX.utils.book_new(),ws=XLSX.utils.json_to_sheet(rows);ws['!cols']=[{wch:38},{wch:12},{wch:10},{wch:22},{wch:22},{wch:12},{wch:15},{wch:17},{wch:25},{wch:27},{wch:38},{wch:14},{wch:22},{wch:20},{wch:22}];XLSX.utils.book_append_sheet(wb,ws,'Movimientos');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(sum),'Resumen');XLSX.writeFile(wb,`Registros ${usuario}.xlsx`);note('📊 Excel descargado')};
 const exportConfig=()=>{const b=new Blob([JSON.stringify({version:'1.2 Stable Final v2',bancos,categorias,tipoCambio},null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='Configuracion Familiar.json';a.click();URL.revokeObjectURL(u);note('📤 Configuración exportada')};
 const importConfig=ev=>{const f=ev.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const c=JSON.parse(r.result);if(!Array.isArray(c.bancos)||!Array.isArray(c.categorias))throw 0;if(confirm('Se reemplazarán bancos, categorías y tipo de cambio. Los movimientos NO se modificarán.')){setBancos(c.bancos);setCategorias(c.categorias);if(Number(c.tipoCambio)>0)setTipoCambio(Number(c.tipoCambio));note('📥 Configuración importada')}}catch{note('⚠️ Archivo inválido')}ev.target.value=''};r.readAsText(f)};
 const addBank=()=>{const v=nuevoB.trim();if(v&&!bancos.includes(v)){setBancos(x=>[...x,v]);setNuevoB('')}};const addGroup=()=>{const v=nuevoG.trim();if(v&&!categorias.some(c=>c.grupo===v)){setCategorias(x=>[...x,{grupo:v,subs:['Otro']}]);setGrupoSel(v);setNuevoG('')}};const addSub=()=>{const v=nuevaS.trim();if(v){setCategorias(x=>x.map(c=>c.grupo===grupoSel&&!c.subs.includes(v)?{...c,subs:[...c.subs,v]}:c));setNuevaS('')}};
 return <>{toast&&<div className="toast">{toast}</div>}{!usuario&&<div className="modal"><div className="card"><h2>¿Quién usa esta aplicación?</h2><p>Esta selección se guarda en este navegador.</p><select value={uTemp} onChange={e=>setUTemp(e.target.value)} style={{width:'100%',padding:10}}><option value="">Seleccionar…</option><option>Fiona</option><option>Berny</option></select><button className="primary" onClick={()=>{if(!uTemp)return note('Seleccioná un usuario');localStorage.setItem(STORAGE.usuario,uTemp);setUsuario(uTemp)}}>Guardar usuario</button></div></div>}
 <div className="header"><div className="wrap"><div className="top"><div><div className="title">Registro Financiero Familiar</div><div className="tag">Costa Rica · {new Date().getFullYear()} · Versión 1.2 Stable Final v2</div></div><div className="fx"><span>Tipo de cambio actual ₡</span><input type="number" step="0.01" min="0.01" value={tipoCambio} onChange={e=>setTipoCambio(+e.target.value)}/></div></div></div></div>
 <div className="wrap"><div className="nav">{[['agregar','➕ Agregar'],['lista','📋 Movimientos'],['dashboard','📈 Dashboard'],['ajustes','⚙️ Ajustes'],['excel','📊 Excel']].map(([k,l])=><button className={`${tab===k?'active ':''}${k==='dashboard'?'dashboardBtn':''}`} onClick={()=>setTab(k)} key={k}>{l}</button>)}<button className="pill" onClick={()=>{localStorage.removeItem(STORAGE.usuario);setUsuario('')}}>👤 {usuario}</button></div><div className="main">
 {tab==='agregar'&&<div className="card">{editId&&<div className="notice">✏️ Estás editando un movimiento existente. El tipo de cambio mostrado es el guardado en ese movimiento.</div>}<div className="grid"><label className="field">👤 Usuario<input value={usuario} readOnly/></label><label className="field">💰 Tipo<select value={form.tipo} onChange={e=>change('tipo',e.target.value)}><option>Gasto</option><option>Ingreso</option><option>Transferencia</option></select>{form.tipo==='Transferencia'&&<span className="hint">Se registra automáticamente como Nuestra Casa → Ahorro.</span>}</label><label className="field">📅 Fecha<input type="date" value={form.fecha} onChange={e=>change('fecha',e.target.value)}/><span className="hint">Inicia en hoy; el calendario permite elegir cualquier fecha anterior.</span></label><label className="field">🏦 Banco<select value={form.banco} onChange={e=>change('banco',e.target.value)}>{bancos.map(b=><option key={b}>{b}</option>)}</select></label><label className="field">📁 Categoría<select value={form.grupo} onChange={e=>change('grupo',e.target.value)}>{categorias.map(c=><option key={c.grupo}>{c.grupo}</option>)}</select></label><label className="field">🏷️ Subcategoría<select value={form.sub} onChange={e=>change('sub',e.target.value)}>{[...new Set([...subs(form.grupo),form.sub].filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es')).map(s=><option key={s}>{s}</option>)}</select></label><label className="field">₡ Monto en colones<input type="text" inputMode="decimal" value={form.montoCRC} onChange={e=>change('montoCRC',formatAmountInput(e.target.value))} placeholder="0.00"/><span className="hint">Equivalente: ${fmt(previewUSD)} USD</span></label><label className="field">💱 Tipo de cambio del movimiento<input type="number" min="0.01" step="0.01" inputMode="decimal" value={form.tipoCambioMovimiento} onChange={e=>change('tipoCambioMovimiento',e.target.value)}/><span className="hint">Se guarda con este movimiento y no cambia después.</span></label><label className="field" style={{gridColumn:'1/-1'}}>📝 Descripción<input value={form.descripcion} onChange={e=>change('descripcion',e.target.value)} placeholder="Descripción del movimiento"/></label></div><button className="primary" onClick={save}>{editId?'Guardar cambios':'Guardar movimiento'}</button>{editId&&<button className="secondary" onClick={()=>{setEditId(null);setForm(emptyForm())}}>Cancelar edición</button>}</div>}
 {tab==='lista'&&<div className="card"><div className="monthSummary"><b>Movimientos ordenados por fecha</b><br/>Los montos en USD usan el tipo de cambio histórico guardado en cada movimiento.</div>{!ordered.length?<div className="empty">No hay movimientos.</div>:<div className="list">{ordered.map(e=><div className="item" style={{borderLeftColor:color(e)}} key={e.id}><div><div className="muted">{e.fecha} · {e.usuario||'Sin usuario'} · {e.banco}</div><div className="desc">{e.descripcion}</div><div className="muted">{e.tipo||'Gasto'} · {e.grupo} → {e.sub}</div><div className="muted">TC: ₡{fmt(e.tipoCambioMovimiento||tipoCambio)} por USD {e.fxMigrado?'· estimado al migrar':''}</div></div><div className="right"><div className="amount" style={{color:color(e)}}>₡{fmt(e.montoCRC)}</div><div className="usd">${fmt(e.montoUSD??(Number(e.montoCRC)/(Number(e.tipoCambioMovimiento)||tipoCambio)))} USD</div><div className="actions"><button className="small" onClick={()=>edit(e)}>✏️ Editar</button><button className="small" onClick={()=>del(e.id)}>🗑️</button></div></div></div>)}</div>}</div>}
 {tab==='dashboard'&&<div className="stack"><div className="card"><div className="dashTop"><div><h2 className="dashTitle">📈 Dashboard financiero</h2><div className="muted">Podés analizar todo el patrimonio o una categoría principal específica.</div></div><div className="row"><label className="field">Período<select className="period" value={periodo} onChange={e=>setPeriodo(e.target.value)}><option value="ALL">Todo el histórico</option>{periodos.map(p=><option value={p} key={p}>{monthLabel(p)}</option>)}</select></label><label className="field">Categoría principal<select className="period" value={grupoDashboard} onChange={e=>setGrupoDashboard(e.target.value)}><option value="ALL">Todas las categorías</option><option value="Nuestra Casa">Nuestra Casa</option><option value="Cassis">Cassis</option><option value="Grimaud">Grimaud</option><option value="Marsella">Marsella</option></select></label></div></div><div className="stats">{[['Ingresos',totals.ing,'#218a5a'],['Gastos',totals.gas,'#b23a48'],['Saldo',totals.saldo,totals.saldo>=0?'#218a5a':'#b23a48'],['Ahorro',totals.ahorro,'#9b741b']].map(([l,v,c])=><div className="stat" key={l}><small>{l}</small><strong style={{color:c}}>₡{fmt(v)}</strong><div className="usd">{filtered.length?`${filtered.length} movimientos · ${grupoDashboard==='ALL'?'Todas las categorías':grupoDashboard}`:'Sin movimientos'}</div></div>)}</div><div className="dashGrid"><div className="chartBox"><h3 style={{marginTop:0}}>Gastos por categoría</h3>{!categories.length?<div className="empty">No hay gastos en este período.</div>:categories.map(([name,value])=><div className="barRow" key={name}><div className="barLabel"><span>{name}</span><b>₡{fmt(value)}</b></div><div className="barTrack"><div className="barFill" style={{width:`${Math.max(3,value/maxCat*100)}%`}}></div></div></div>)}</div><div className="chartBox"><h3 style={{marginTop:0}}>Resumen del período</h3><div className="summary"><b>Período:</b> {monthLabel(periodo)}<br/><b>Categoría principal:</b> {grupoDashboard==='ALL'?'Todas':grupoDashboard}<br/><b>Movimientos:</b> {filtered.length}<br/><b>Ingresos:</b> ₡{fmt(totals.ing)}<br/><b>Gastos:</b> ₡{fmt(totals.gas)}<br/><b>Flujo neto:</b> ₡{fmt(totals.saldo)}<br/><b>Aportes al ahorro:</b> ₡{fmt(totals.ahorro)}</div></div></div></div></div>}
 {tab==='ajustes'&&<div className="stack"><div className="card"><h3>🏦 Bancos y fuentes</h3><div className="chips">{bancos.map(b=><span className="chip" key={b}>{b}</span>)}</div><div className="row"><input value={nuevoB} placeholder="Nuevo banco" onChange={e=>setNuevoB(e.target.value)}/><button className="mini" onClick={addBank}>Agregar</button></div></div><div className="card"><h3>📁 Categorías y subcategorías</h3><div className="row"><input value={nuevoG} placeholder="Nueva categoría" onChange={e=>setNuevoG(e.target.value)}/><button className="mini" onClick={addGroup}>Agregar grupo</button></div><br/><label className="field">Grupo a editar<select value={grupoSel} onChange={e=>setGrupoSel(e.target.value)}>{categorias.map(c=><option key={c.grupo}>{c.grupo}</option>)}</select></label><div className="chips">{subs(grupoSel).map(s=><span className="chip" key={s}>{s}</span>)}</div><div className="row"><input value={nuevaS} placeholder="Nueva subcategoría" onChange={e=>setNuevaS(e.target.value)}/><button className="mini" onClick={addSub}>Agregar sub</button></div></div><div className="card"><h3>🔄 Compartir configuración</h3><p>Exporta categorías, bancos y tipo de cambio actual. Importar no modifica los movimientos ni sus tipos de cambio históricos.</p><div className="row"><button className="mini" onClick={exportConfig}>📤 Exportar</button><button className="mini" onClick={()=>fileRef.current.click()}>📥 Importar</button><input ref={fileRef} type="file" accept=".json" onChange={importConfig} style={{display:'none'}}/></div></div></div>}
 {tab==='excel'&&<div className="card"><h2>📊 Exportar Excel</h2><p>El archivo conserva el monto en colones, el tipo de cambio de cada movimiento y su equivalente histórico en USD.</p><div className="summary"><b>Usuario:</b> {usuario}<br/><b>Movimientos:</b> {entradas.length}<br/><b>Períodos disponibles:</b> {periodos.length}<br/><b>Tipo de cambio actual:</b> ₡{fmt(tipoCambio)} por USD</div><button className="primary" onClick={exportExcel}>Descargar Excel</button></div>}
 </div></div></>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
